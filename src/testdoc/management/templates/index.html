<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robot Framework - Test Management</title>
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    var stored = null;
    try {
      stored = localStorage.getItem("testdoc-management-theme");
    } catch (error) {
      stored = null;
    }
    var theme = stored === "dark" || stored === "light" ? stored : "light";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="2" fill="currentColor" opacity="0.55"/><rect x="3" y="14" width="7" height="7" rx="2" fill="currentColor" opacity="0.55"/><rect x="14" y="14" width="7" height="7" rx="2" fill="currentColor"/></svg>
      </span>
      <span class="sidebar-brand-text">Test Management</span>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-nav-item" data-page="dashboard" href="#/dashboard" title="Dashboard">
        <span class="sidebar-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>
        </span>
        <span class="sidebar-nav-text">Dashboard</span>
      </a>
      <a class="sidebar-nav-item" data-page="repository" href="#/repository" title="Test Case Repository">
        <span class="sidebar-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.379a1.5 1.5 0 0 1 1.06.44L11 6.5H19.5A1.5 1.5 0 0 1 21 8v9.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z" fill="currentColor"/></svg>
        </span>
        <span class="sidebar-nav-text">Test Case Repository</span>
      </a>
      <a class="sidebar-nav-item" data-page="history" href="#/history" title="Test Result History">
        <span class="sidebar-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="sidebar-nav-text">Test Result History</span>
      </a>
    </nav>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Expand / collapse menu">
      <span id="sidebar-toggle-icon" class="sidebar-toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </aside>

  <div class="content">
    <header class="header">
      <button class="header-home" id="header-home" type="button" title="Back to Dashboard">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v5h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="header-title" id="header-title">Dashboard</h1>
      <button class="header-theme-toggle" id="header-theme-toggle" type="button" title="Toggle dark / light theme">
        <span class="header-theme-icon header-theme-icon-light">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="header-theme-icon header-theme-icon-dark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 13.6A8.5 8.5 0 1 1 10.4 4a6.7 6.7 0 0 0 9.6 9.6Z" fill="currentColor"/></svg>
        </span>
      </button>
    </header>
    <main class="main" id="view-root"></main>
  </div>
</div>

<script id="management-data" type="application/json">{{ data_json | safe }}</script>
<script src="app.js"></script>
</body>
</html>
